name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.10 / Django 4.0 / DRF 3.14 (core)
            python-version: "3.10"
            django: "~=4.0.0"
            drf: "~=3.14.0"
            adrf: ""
          - name: Python 3.10 / Django 4.1 / DRF 3.14 / ADRF 0.1.7
            python-version: "3.10"
            django: "~=4.1.0"
            drf: "~=3.14.0"
            adrf: "adrf==0.1.7"
          - name: Python 3.10 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.10"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.11 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.11"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.12 / Django 6.0 / DRF 3.18 / ADRF latest
            python-version: "3.12"
            django: "~=6.0.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.13 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.13"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.14 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.14"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.14 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.14"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.15 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.15"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compatibility test dependencies
        run: |
          python -m pip install -e . \
            "Django${{ matrix.django }}" \
            "djangorestframework${{ matrix.drf }}" \
            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.24,<2' \
            'pytest-django>=4.9,<5'
      - name: Install ADRF
        if: matrix.adrf != ''
        run: python -m pip install '${{ matrix.adrf }}'
      - name: Run tests
        run: python -m pytest

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' 'twine>=5,<8'
      - name: Check formatting
        run: python -m black --check src tests
      - name: Check import order
        run: python -m isort --check-only src tests
      - name: Run flake8
        run: python -m flake8 src tests
      - name: Run mypy
        run: python -m mypy --explicit-package-bases src/yandex_drf_mixins
      - name: Run pylint
        run: PYTHONPATH=.:src python -m pylint src/yandex_drf_mixins
      - name: Run Bandit
        run: python -m bandit -q -r src
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*

  wheel-without-adrf:
    name: Wheel without optional ADRF dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Create clean environment
        run: python -m venv /tmp/yandex-drf-mixins-wheel-test
      - name: Install wheel without ADRF
        run: |
          /tmp/yandex-drf-mixins-wheel-test/bin/pip install \
            dist/yandex_drf_mixins-*.whl pytest pytest-django
      - name: Run tests against installed wheel
        run: |
          PYTHONPATH=. DJANGO_SETTINGS_MODULE=tests.settings \
            /tmp/yandex-drf-mixins-wheel-test/bin/python -m pytest -q
