name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' 'twine>=5,<8'
      - name: Check formatting
        run: python -m black --check src tests
      - name: Check import order
        run: python -m isort --check-only src tests
      - name: Run flake8
        run: python -m flake8 src tests
      - name: Run mypy
        run: python -m mypy --explicit-package-bases src/yandex_drf_mixins
      - name: Run pylint
        run: PYTHONPATH=.:src python -m pylint src/yandex_drf_mixins
      - name: Run Bandit
        run: python -m bandit -q -r src
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
