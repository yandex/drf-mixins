name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.10 / Django 4.0 / DRF 3.14 (core)
            python-version: "3.10"
            django: "~=4.0.0"
            drf: "~=3.14.0"
            adrf: ""
          - name: Python 3.10 / Django 4.1 / DRF 3.14 / ADRF 0.1.7
            python-version: "3.10"
            django: "~=4.1.0"
            drf: "~=3.14.0"
            adrf: "adrf==0.1.7"
          - name: Python 3.10 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.10"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.11 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.11"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.12 / Django 6.0 / DRF 3.18 / ADRF latest
            python-version: "3.12"
            django: "~=6.0.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.13 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.13"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.14 / Django 5.2 / DRF 3.18 / ADRF latest
            python-version: "3.14"
            django: "~=5.2.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.14 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.14"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
          - name: Python 3.15 / Django 6.1 / DRF 3.18 / ADRF latest
            python-version: "3.15"
            django: "~=6.1.0"
            drf: "~=3.18.0"
            adrf: "adrf~=0.1.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compatibility test dependencies
        run: |
          python -m pip install -e . \
            "Django${{ matrix.django }}" \
            "djangorestframework${{ matrix.drf }}" \
            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.24,<2' \
            'pytest-django>=4.9,<5'
      - name: Install ADRF
        if: matrix.adrf != ''
        run: python -m pip install '${{ matrix.adrf }}'
      - name: Run tests
        run: python -m pytest

  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release commit and version
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as stream:
              project_version = tomllib.load(stream)["project"]["version"]
          package_source = pathlib.Path("src/yandex_drf_mixins/__init__.py").read_text()
          package_version = re.search(r'^__version__ = "([^"]+)"$', package_source, re.MULTILINE)
          if package_version is None:
              raise SystemExit("Package version declaration was not found")
          versions = (tag_version, project_version, package_version.group(1))
          if len(set(versions)) != 1:
              raise SystemExit(f"Tag, project, and package versions differ: {versions}")
          PY
      - name: Install development and build dependencies
        run: python -m pip install -e '.[dev]' 'twine>=5,<8'
      - name: Check formatting
        run: python -m black --check src tests
      - name: Check import order
        run: python -m isort --check-only src tests
      - name: Run flake8
        run: python -m flake8 src tests
      - name: Run mypy
        run: python -m mypy --explicit-package-bases src/yandex_drf_mixins
      - name: Run pylint
        run: PYTHONPATH=.:src python -m pylint src/yandex_drf_mixins
      - name: Run Bandit
        run: python -m bandit -q -r src
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - compatibility
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yandex-drf-mixins/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
