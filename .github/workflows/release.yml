name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest

  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release commit and version
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as stream:
              project_version = tomllib.load(stream)["project"]["version"]
          package_source = pathlib.Path("src/yandex_drf_mixins/__init__.py").read_text()
          package_version = re.search(r'^__version__ = "([^"]+)"$', package_source, re.MULTILINE)
          if package_version is None:
              raise SystemExit("Package version declaration was not found")
          versions = (tag_version, project_version, package_version.group(1))
          if len(set(versions)) != 1:
              raise SystemExit(f"Tag, project, and package versions differ: {versions}")
          PY
      - name: Install development and build dependencies
        run: python -m pip install -e '.[dev]' 'twine>=5,<8'
      - name: Check formatting
        run: python -m black --check src tests
      - name: Check import order
        run: python -m isort --check-only src tests
      - name: Run flake8
        run: python -m flake8 src tests
      - name: Run mypy
        run: python -m mypy --explicit-package-bases src/yandex_drf_mixins
      - name: Run pylint
        run: PYTHONPATH=.:src python -m pylint src/yandex_drf_mixins
      - name: Run Bandit
        run: python -m bandit -q -r src
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - tests
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yandex-drf-mixins/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
